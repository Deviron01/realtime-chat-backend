
spring.application.name=RealTimeChat

# =====================================
# DATABASE CONFIGURATION
# =====================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:realtimechatdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:14336}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# JPA / HIBERNATE CONFIGURATION
# =====================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================
# SERVER CONFIGURATION
# =====================================

server.port=${PORT:8089}

# =====================================
# JWT CONFIGURATION
# =====================================

jwt.secret=${JWT_SECRET:Uh3yEJdIL917vrG0BNnaN5ff5vcrRRZ3MnnTF5UhDCWilKe6}
jwt.expiration=86400000

# =====================================
# WEBSOCKET LOGGING
# =====================================

logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.web.socket.messaging=INFO
